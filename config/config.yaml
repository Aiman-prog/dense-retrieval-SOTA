# --- Global Model Settings ---
model:
  base_model: "sentence-transformers/msmarco-bert-base-dot-v5"
  query_max_len: 256
  passage_max_len: 512

# --- Paths Configuration ---
paths:
  data_dir: "data"
  processed_dir: "data/processed"
  bright_cache: "data/bright"
  models_dir: "models"
  results_dir: "results/bright_benchmark"
  
  # Static Filenames
  train_file: "train_reasonir.jsonl"  # Created by your preprocessor

# --- Data Sources ---
data:
  bright:
    name: "xlangai/BRIGHT"
    examples_config: "Gemini-1.0_reason"
    cache_dir: "data/bright"
  reasonir:
    name: "reasonir/reasonir-data"
    subset: "hq"
    train_file: "train_reasonir.jsonl"

# --- Training Recipes ---
training:
  logging_steps: 100
  overwrite_output_dir: true
  dataloader_num_workers: 4
  inbatch:
    model_name: "inbatch_reasonir_neg"
    batch_size: 64
    learning_rate: 1e-5
    num_epochs: 2
    train_group_size: 2
    bf16: True
    dataloader_num_workers: 4
  crossbatch:
    model_name: "reasonir_hq_2048_v100"
    batch_size: 16
    target_batch_size: 2048
    per_device_batch_size: 64
    gradient_accumulation_steps: 16
    gc_q_chunk_size: 16
    gc_p_chunk_size: 16
    learning_rate: 1e-5
    num_epochs: 2
    train_group_size: 1
    grad_cache: true
    bf16: true
    max_grad_norm: 1.0
    logging_steps: 10
    dataloader_num_workers: 4
  ance:
    base_model: "/scratch/aimanabdulwaha/dense-retrieval-SOTA/models/inbatch_reasonir_Neg"
    model_name: "ance_reasonir_v1"
    num_episodes: 3 #change to 3 once u know its working
    mining_depth: 200 #change to 200 once u know its working
    learning_rate: 2e-6
    batch_size: 64                # For training, change to 64 for gpu-a100
    per_device_eval_batch_size: 512  # For encoding (from your evaluate.py logic), change to 512 for  gpu-a100
    num_epochs: 2
    bf16: true
    train_group_size: 2
    dataloader_num_workers: 2
    gradient_checkpointing: true
    save_strategy: "no"
    save_total_limit: 1
    logging_steps: 100
    eval_top_k: 10


# --- Evaluation Settings (Restored & Cleaned) ---
evaluation:
  eval_domains:
    - "biology"
    - "earth_science"
    - "economics"
    - "psychology"
    - "robotics"
    - "stackoverflow"
    - "sustainable_living"
    - "pony"
    - "leetcode"
    - "aops"
    - "theoremqa_theorems"
    - "theoremqa_questions"
  metrics:
    - "MRR"
    - "NDCG@10"
    - "Recall@1000"
  top_k: 1000
  batch_size: 128
  trec_eval_path: "trec_eval"
  bf16: False