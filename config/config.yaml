# --- Global Model Settings ---
model:
  base_model: "BAAI/bge-m3"
  pooling: "cls"  # BGE-M3 uses CLS pooling for dense retrieval
  normalize: true
  temperature: 0.02  # Standard for dense retrieval contrastive learning
  query_max_len: 256   # ✅ Verified: 100% coverage (all datasets)
  passage_max_len: 128  # ✅ Verified: 99% coverage, 4x faster training (1% truncation acceptable)

# --- Paths Configuration ---
paths:
  data_dir: "data"
  processed_dir: "data/processed"
  bright_cache: "data/bright"
  models_dir: "models"
  results_dir: "results/bright_benchmark"

# --- Data Sources ---
data:
  bright:
    name: "xlangai/BRIGHT"
    examples_config: "Gemini-1.0_reason"
    cache_dir: "data/bright"
  reasonir:
    name: "reasonir/reasonir-data"
    subset: "hq"
    train_file: "train_reasonir.jsonl"
  mixed_training:
    msmarco_samples: 83030   # 23.7% - Public data bridge + calibration (prevent forgetting)
    vl_samples: 149970       # 42.8% - ALL available clean VL (length generalization)
    hq_samples: 97000        # 27.7% - Nearly all HQ (reasoning-intensive queries)
    # Total: 350k samples | Note: VL corrupted before index 95k, only 150k clean samples available
  msmarco:
    name: "sentence-transformers/msmarco-distilbert-margin-mse-mean-dot-v1"
    subset: "triplet"

# --- Training Recipes ---
training:
  logging_steps: 100
  overwrite_output_dir: true
  dataloader_num_workers: 4
  inbatch:
    model_name: "inbatch_mixed_bge_m3"
    batch_size: 64
    learning_rate: 1e-5
    num_epochs: 2
    train_group_size: 2
    bf16: True
    dataloader_num_workers: 4
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
  crossbatch:
    model_name: "crossbatch_mixed_bge_m3_epoch2"
    batch_size: 16
    target_batch_size: 2048
    per_device_batch_size: 64
    gradient_accumulation_steps: 16
    gc_q_chunk_size: 16
    gc_p_chunk_size: 16
    learning_rate: 1e-5  # Lower LR for BGE-M3 continued training
    warmup_ratio: 0.1
    weight_decay: 0.01
    num_epochs: 2  # Quick validation run
    train_group_size: 2
    grad_cache: true
    bf16: true
    max_grad_norm: 1.0
    logging_steps: 10
    dataloader_num_workers: 4
  grass:
    model_name: "grass_mixed_bge_m3"
    base_model: "/scratch/aimanabdulwaha/dense-retrieval-SOTA/models/inbatch_mixed_bge_m3"
    P: 200             # candidates retrieved from stale ANN per query
    L: 50              # shortlist size: top-L by cheap pass before MC-dropout (L <= P)
    m: 5               # negatives per query (= train_group_size - 1)
    T: 10              # MC-dropout forward passes
    lambda_val: 0.5    # uncertainty weight in g = s_hat + lambda * sigma
    mc_batch_size: 256  # batch size for in-process MC-dropout encoding
    query_batch_size: 64  # number of queries processed per GrassSampler batch (controls peak GPU memory)
    learning_rate: 1e-5
    batch_size: 64
    per_device_eval_batch_size: 512
    num_epochs: 1
    train_group_size: 6
    bf16: true
    dataloader_num_workers: 2
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 1
    logging_steps: 100
    eval_top_k: 10
  ance:
    base_model: "/scratch/aimanabdulwaha/dense-retrieval-SOTA/models/inbatch_mixed_bge_m3"
    model_name: "ance_mixed_bge_m3"
    train_group_size: 2    # Paper: 1 negative per positive (MS MARCO default, Table 3)
    mining_depth: 200      # Paper: top-200 ANN candidates (Table 7); MS MARCO default
    total_epochs: 3        # Total training budget in standard epochs (~10 ANCE refresh cycles to converge)
    learning_rate: 1e-5    # Paper (MS MARCO): LAMB optimizer 3e-6 (Section 6.1); AdamW equivalent ~1e-5 for BGE-M3
    batch_size: 64         # Paper (MS MARCO): batch_size=8 with gradient_accum=2 → effective 16; we use larger batch
    per_device_eval_batch_size: 512
    bf16: true
    dataloader_num_workers: 2
    warmup_ratio: 0.1      # Paper (MS MARCO): 5000 warmup steps (~7.5% of total); 0.1 × our 16.5k steps ≈ 1650
    weight_decay: 0.01
    max_grad_norm: 1.0
    save_steps: 1000       # ANN refresh interval (scaled from paper's 10k batches at MS MARCO scale)
                           # Paper: refresh every 10k batches (batch=8); proportional: 10k×(5.5k/66k)≈833→1000
                           # Appendix A.3 Fig 5: 1:1 GPU ratio is optimal at this refresh frequency
    save_total_limit: 3    # Keep last 3 checkpoints (Inferencer always uses latest)
    logging_steps: 100
    eval_top_k: 10
    data_gen_poll_interval: 60   # Inferencer polls every 60s (paper run_ann_data_gen.py: time.sleep(60))
    gradient_checkpointing: false
    corpus_file: "reasonir_corpus.jsonl"
    train_queries_file: "train_queries.jsonl"
    train_qrels_file: "train_qrels.txt"
    mixture_dir: "training_mixture"
    temp_workdir: "temp_ance"
    setup_mode: "reasonir_mixture"
    eval_corpus_file: null
    eval_queries_file: null
    eval_qrels_file: null
    eval_metric: "ndcg_cut_10"
  ance_msmarco:
    base_model: "BAAI/bge-m3"
    model_name: "ance_msmarco_bge_m3"
    train_group_size: 2                 # Paper: 1 negative per positive (Table 3)
    mining_depth: 200                   # Paper: top-200 ANN (Table 7)
    total_epochs: 10                    # Paper: ~10 ANCE epochs to converge
    learning_rate: 5e-6                 # Paper LAMB 3e-6; AdamW equiv ~5e-6 for BGE-M3
    batch_size: 64
    per_device_eval_batch_size: 256     # 8.8M corpus needs memory headroom
    dataloader_num_workers: 4
    warmup_ratio: 0.06                  # Paper: 5000 steps / ~83k total ≈ 6%
    weight_decay: 0.01
    max_grad_norm: 1.0
    save_steps: 10000                   # Paper: refresh every 10k batches
    save_total_limit: 3
    logging_steps: 500
    eval_top_k: 1000
    data_gen_poll_interval: 60
    gradient_checkpointing: false
    corpus_file: "msmarco_corpus.jsonl"
    train_queries_file: "msmarco_train_queries.jsonl"
    train_qrels_file: "msmarco_train_qrels.txt"
    mixture_dir: "msmarco_training_mixture"
    temp_workdir: "temp_ance_msmarco"
    setup_mode: "tevatron_msmarco"
    eval_corpus_file: "msmarco_corpus.jsonl"
    eval_queries_file: "msmarco_dev_queries.jsonl"
    eval_qrels_file: "msmarco_dev_qrels.txt"
    eval_metric: "recip_rank"


# --- Evaluation Settings (Restored & Cleaned) ---
evaluation:
  eval_domains:
    - "biology"
    - "earth_science"
    - "economics"
    - "psychology"
    - "robotics"
    - "stackoverflow"
    - "sustainable_living"
    - "pony"
    - "leetcode"
    - "aops"
    - "theoremqa_theorems"
    - "theoremqa_questions"
  metrics:
    - "MRR"
    - "NDCG@10"
    - "Recall@1000"
  top_k: 1000
  batch_size: 128
  trec_eval_path: "trec_eval"
  bf16: True
  dataloader_num_workers: 4
  bm25:
    k1: 0.9
    b: 0.4