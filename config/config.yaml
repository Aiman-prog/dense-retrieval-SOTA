# --- Global Model Settings ---
model:
  base_model: "sentence-transformers/msmarco-bert-base-dot-v5"
  query_max_len: 128
  passage_max_len: 512

# --- Paths Configuration ---
paths:
  data_dir: "data"
  processed_dir: "data/processed"
  bright_cache: "data/bright"
  models_dir: "models"
  results_dir: "results/bright_benchmark"
  
  # Static Filenames
  train_file: "train_reasonir.jsonl"  # Created by your preprocessor

# --- Data Sources ---
data:
  bright:
    name: "xlangai/BRIGHT"
    examples_config: "Gemini-1.0_reason"
    cache_dir: "data/bright"
  reasonir:
    name: "reasonir/reasonir-data"
    subset: "hq"
    train_file: "train_reasonir.jsonl"

# --- Training Recipes ---
training:
  logging_steps: 10
  overwrite_output_dir: true
  dataloader_num_workers: 2
  inbatch:
    model_name: "inbatch_reasonir"
    batch_size: 16
    learning_rate: 1e-5
    num_epochs: 2
    train_group_size: 1
    bf16: true
  crossbatch:
    model_name: "reasonir_hq_2048_v100"
    batch_size: 16
    target_batch_size: 2048
    learning_rate: 1e-5
    num_epochs: 2
    train_group_size: 1
    grad_cache: true

# --- Evaluation Settings (Restored & Cleaned) ---
evaluation:
  eval_domains:
    - "biology"
    - "earth_science"
    - "economics"
    - "psychology"
    - "robotics"
  metrics:
    - "MRR"
    - "NDCG@10"
    - "Recall@10"
  top_k: 10
  trec_eval_path: "trec_eval"