# --- Reproducibility ---
seed: 42

# --- Global Model Settings ---
model:
  base_model: "BAAI/bge-m3"
  pooling: "cls"  # BGE-M3 uses CLS pooling for dense retrieval
  normalize: true
  temperature: 0.02  # Standard for dense retrieval contrastive learning
  query_max_len: 1024  # Measured (BGE-M3 tokenizer): BRIGHT eval queries are long reasoning prompts (median ~666 tok); 256 covered ~0% of them, 1024 covers ~95%. Train queries (reasonir, median ~79) fit easily. Dynamic padding => negligible cost on short queries.
  passage_max_len: 512   # FirstP cap for every BGE-M3 arm. p1024 was adopted and then
                         # REVERTED on measurement: job 64255 (A100 80GB) put batch 64 /
                         # group 2 at 11.29 s/step against p512's measured 4.05, i.e. ~32h
                         # for two epochs against a 24h per-job wall. Peak was 60.09 GiB
                         # with gradient checkpointing already enabled, so that cannot be
                         # traded back, and attention is stuck on eager (transformers is
                         # pinned at 4.40.2, where XLM-R reports _supports_sdpa False).
                         # What 512 costs is real and tabulated per domain in
                         # docs/ance_code_review_and_bright_adaptation.md 7.3: it retains
                         # only 46.18% of StackOverflow and 18.42% of Earth-science
                         # relevant tokens, against 87.78% / 29.29% at 1024. Whether that
                         # truncation changes RETRIEVAL is unmeasured -- that is the 7.4
                         # step-2 ablation, and it gates any future move back to 1024.
                         # Dynamic padding everywhere, so short passages cost nothing.
                         # Changing this forks EVERY arm: it is part of the encoding
                         # contract, so checkpoints at the other cap are refused at
                         # evaluation, and the Fast-GRASS stale index must be rebuilt.

# --- Paths Configuration ---
paths:
  data_dir: "data"
  processed_dir: "data/processed"
  bright_cache: "data/bright"
  models_dir: "models"
  results_dir: "results/bright_benchmark"

# --- Data Sources ---
data:
  bright:
    name: "xlangai/BRIGHT"
    examples_config: "examples"
    cache_dir: "data/bright"
  reasonir:
    name: "reasonir/reasonir-data"
  mixed_training:
    msmarco_samples: 83030   # 25.2% - Public data bridge + calibration (prevent forgetting)
    vl_samples: 149970       # 45.4% - ALL available clean VL (length generalization)
    hq_samples: 97000        # 29.4% - Nearly all HQ (reasoning-intensive queries)
    vl_skip_first_n: 95000   # VL rows before this index are corrupted; skipped at generation
    # Requested total: 330,000. VL writes 149,963 (7 rows past the cutoff are unusable),
    # so the actual total is 329,993 -- the generators print requested vs written.
  msmarco:
    name: "sentence-transformers/msmarco-distilbert-margin-mse-mean-dot-v1"
    subset: "triplet"
  msmarco_reproduction:
    # These are separate repositories, so they require separate immutable revisions.
    # The passage revision supplies train/dev; the corpus revision supplies all 8.8M
    # passage ids/texts. Derived-file SHA-256 values are also recorded in each run.
    passage_revision: "330a160b40a739d4c07d52c7ce562e2c549214c0"
    corpus_revision: "21a2e1a8c6e7b1747c92f82cd2259a97077dc48d"

# --- Training Recipes ---
training:
  # Fallback for a recipe that declares no logging_steps of its own.
  logging_steps: 100
  dataloader_num_workers: 4
  inbatch:
    model_name: "inbatch_mixed_bge_m3"
    batch_size: 64
    learning_rate: 1e-5
    num_epochs: 2
    train_group_size: 2
    bf16: True
    dataloader_num_workers: 4
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    logging_steps: 100
    save_total_limit: 6
    save_fraction: 0.2        # checkpoint every 20% of total steps
    gradient_checkpointing: true   # THE memory fix at query_max_len 1024 + eager attention
  crossbatch:
    model_name: "crossbatch_mixed_bge_m3_epoch2"
    target_batch_size: 1024   # = per_device_batch_size * num_gpus (negative pool); accum does NOT enlarge it
    per_device_batch_size: 512   # 512 * 2 GPUs (DistributedContrastiveLoss all_gather) = 1024 query pool
    gradient_accumulation_steps: 1   # accumulation does not pool cross-batch negatives in GradCache
    gc_q_chunk_size: 32       # GradCache bounds PEAK MEMORY by chunk (not per_device); raise/lower this to tune memory
    gc_p_chunk_size: 32       # Briefly 16 to hold peak memory flat at p1024; restored with
                              # the p512 revert, which is also what checkpoint-600 was built
                              # at. Chunk size bounds activation memory only -- the pool stays
                              # 1024 queries / 2047 negatives (check_batch_invariants).
    learning_rate: 1e-5  # Lower LR for BGE-M3 continued training
    warmup_ratio: 0.1
    weight_decay: 0.01
    num_epochs: 2  # Quick validation run
    train_group_size: 2
    grad_cache: true
    bf16: true
    max_grad_norm: 1.0
    logging_steps: 10
    dataloader_num_workers: 0   # 0 = collate inline. NOTE: this did NOT prevent the SIGBUS it was
                                # added for -- 18995 died of SIGBUS at 98% with 0 workers, while
                                # in-batch 18996 ran 4 workers for 13h clean. Real cause was the
                                # mmap'd Singularity image going unreadable (P14). Value kept only
                                # because changing it now would fork the crossbatch fingerprint.
    save_steps: 100
    save_total_limit: 3
    gradient_checkpointing: true   # cross-batch omitted this and never reached a checkpoint
  grass:
    # σ estimator is selected at the CLI: --uncertainty {mc_dropout, ema}
    model_name: "grass_mixed_bge_m3"   # base name — code appends _mc_dropout or _ema
    base_model: "BAAI/bge-m3"   # every mining arm starts from the SAME base as the
                                # in-batch baseline, so the BRIGHT table compares one
                                # variable: negative selection. Warm-starting these
                                # from inbatch_mixed_bge_m3 gave them ~2x the baseline's
                                # cumulative optimizer steps.

    # --- Shared ---
    P: 200             # candidates retrieved from stale ANN per query
    L: 25              # shortlist size after fresh current-model rerank (L <= P) — [S9] halved from 50
    m: 1               # negatives per query (= train_group_size - 1)
    lambda_val: 1.0    # uncertainty weight in g = s_hat + lambda * sigma
    mc_batch_size: 1024 # encoding batch size (controls peak GPU memory during mining)
    learning_rate: 1e-5
    num_epochs: 2
    train_group_size: 2
    bf16: true                # bf16 WEIGHTS, not just autocast: Tevatron's driver
                              # derives torch_dtype from this for the in-batch and
                              # cross-batch arms, so the BRIGHT comparison would
                              # otherwise straddle two numerical paths.
    dataloader_num_workers: 2
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    save_strategy: "steps"
    save_steps: 1000   # [S12] doubled from 500 — saves ~2 min in checkpoint I/O per 3 epochs
    save_total_limit: 1
    logging_steps: 100
    eval_top_k: 10
    per_device_eval_batch_size: 256

    # --- EMA-specific (used when --uncertainty ema) ---
    ema_alpha: 0.999

    # --- MC-dropout-specific (used when --uncertainty mc_dropout) ---
    T: 3               # MC-dropout forward passes
    mc_dropout_p: 0.3  # dropout probability for MC passes (0.1 default is too weak)
    batch_size: 64
    max_pool_per_query: 200  # FAISS candidate pool cap per query
  fast_grass:
    # Negative-Cache-inspired mining: one bounded global cache H replaces the
    # per-query stale top-P pools. See fast_grass_*.md. Default = MCDP + TopK.
    model_name: "fast_grass_mixed_bge_m3"
    base_model: "BAAI/bge-m3"   # every mining arm starts from the SAME base as the
                                # in-batch baseline, so the BRIGHT table compares one
                                # variable: negative selection. Warm-starting these
                                # from inbatch_mixed_bge_m3 gave them ~2x the baseline's
                                # cumulative optimizer steps.

    # --- Cache / selection (v0 defaults from fast_grass_implementation_details.md) ---
    B_doc: 100000            # global cache size; ablate 32k / 100k / 512k
    m: 1                     # negatives per query (= train_group_size - 1)
    selection_mode: "topk"   # topk | softmax
    lambda_val: 1.0          # g = s_hat + lambda * sigma; baseline ablation = 0
    beta: 5.0                # softmax-mode temperature only
    uncertainty: "mcdp"      # mcdp (teacher-free, default) | ema (baseline)
    ema_alpha: 0.999         # EMA-teacher decay (ema mode only; == ema_decay in doc)

    # --- MCDP estimator (teacher-free top-L MC-dropout) ---
    L: 128                   # MCDP lazy top-L inside H / softmax prefilter.
                             # MCDP cost ~ batch_size*L*T (guardrail warns > 25k);
                             # first real run may prefer L 50-64. (was 1024 for EMA/softmax)
    T: 3                     # MCDP stochastic dropout passes
    mc_dropout_p: 0.3        # dropout probability for MCDP passes

    # --- Cache maintenance ---
    rho_start: 0.50          # linear-decay maintenance fraction (start)
    rho_end: 0.10            # linear-decay maintenance fraction (end)
    cache_update_interval: 100   # steps between maintenance cycles
    max_age_epochs: 4        # -> max_age_steps = max_age_epochs * steps_per_epoch (runtime)
    utility_ema_decay: 0.95
    utility_floor: 0.01      # low-utility replacement threshold
    utility_remember_threshold: 0.05  # min peak utility to admit to R if never selected
    K: 3                     # replace after K intervals with zero selections
    R_fraction: 0.25         # fraction of replacement candidates from registry R
    uniform_candidate_fraction: 0.75  # uniform corpus candidates stay dominant (>=0.75)
    replacement_candidate_multiplier: 2   # recertify 2x the final replacement slots
    recent_query_reservoir_size: 128  # recertification query probe size
    reentry_top_k: 5         # avg top-5 g for candidate re-entry
    R_size_factor: 0.5       # R_size = R_size_factor * B_doc
    cache_init_seed: 42      # reproducible uniform H init

    # --- Training knobs (copied from grass so the block is self-contained) ---
    learning_rate: 1e-5
    num_epochs: 2
    batch_size: 64           # minibatch size for the Algorithm-1 outer loop
    train_group_size: 2
    mc_batch_size: 1024      # encode batch size for queries / cache maintenance
    bf16: true                # bf16 WEIGHTS, not just autocast: Tevatron's driver
                              # derives torch_dtype from this for the in-batch and
                              # cross-batch arms, so the BRIGHT comparison would
                              # otherwise straddle two numerical paths.
    dataloader_num_workers: 2
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    save_strategy: "steps"
    save_steps: 1000
    save_total_limit: 1
    logging_steps: 100
    eval_top_k: 10
    per_device_eval_batch_size: 256

  async_fast_grass: &async_fg_base
    # Async Fast-GRASS (cached-MCDP). ANCE-style 2-process split: trainer on GPU 0
    # consumes mined rounds, miner on GPU 1 prepares the next one from a recent
    # checkpoint. See async_fast_grass_architecture.md.
    # Sibling to `fast_grass` above, which stays SEQUENTIAL (lazy top-L MCDP) —
    # these defaults deliberately differ from it.
    model_name: "async_fast_grass_mixed_bge_m3"
    base_model: "BAAI/bge-m3"   # every mining arm starts from the SAME base as the
                                # in-batch baseline, so the BRIGHT table compares one
                                # variable: negative selection. Warm-starting these
                                # from inbatch_mixed_bge_m3 gave them ~2x the baseline's
                                # cumulative optimizer steps.

    # --- cached-MCDP: no L key; every query is scored against ALL of H ---
    uncertainty: "cached_mcdp"   # async production mode; async EMA is deferred
    B_doc: 32000             # first-run cache size; test 100k only after 32k passes
    T: 3                     # cached doc MC states AND fresh query passes
    lambda_val: 0.5          # g = s_hat + lambda*sigma; ALWAYS also run 0
    mc_dropout_p: 0.3
    m: 1                     # negatives per query
    selection_mode: "topk"   # topk | softmax (softmax uses L=None => full cache)
    beta: 5.0                # softmax-mode temperature only
    score_chunk_size: 8192   # chunk Q x Z_mc over cache slots to bound the buffer

    # --- cache maintenance (periodic, IN-ROUND) ---
    rho_start: 0.50
    rho_end: 0.25            # quality-oriented; sequential fast_grass uses 0.10
    max_age_epochs: 2        # LEGACY fallback, used only when max_age_steps is null.
                             # Kept for reference: the explicit key below WINS.
    max_age_steps: 1000      # CORRECTED. _plan_actions tests `age >= max_age_steps`,
                             # and age is measured in trainer steps. The old derived
                             # value (max_age_epochs * steps_per_epoch = 2 * 5157 =
                             # 10314) equalled total_steps, so over-age refresh only
                             # became eligible on the final round and no refreshed
                             # round ever reached the trainer. Matched to the
                             # checkpoint cadence (async_mine_every_steps) so the
                             # first numeric round is eligible to refresh.
    cache_update_interval: 100    # trainer-step-equivalent; sizes the BUDGET.
                             # The miner's execution TRIGGER is
                             # cache_update_interval * batch_size mined queries.
    utility_ema_decay: 0.95
    utility_floor: 0.01
    K: 3                     # replace after K intervals with zero selections
    replacement_candidate_multiplier: 2   # recertify 2x the final replacement slots
    recent_query_reservoir_size: 128      # query-MC probe for recertification
    cache_init_seed: 42
    cache_state_keep: 2      # cache_state_N.pt retained; markers/data never pruned
    miner_mc_batch_size: 128 # miner doc-MC encode batch, separate from mc_batch_size
    # R_doc (retired-document registry) is DEFERRED: replacement candidates are
    # sampled uniformly from the corpus excluding H, then recertified against the
    # query-MC reservoir. R_fraction / R_size_factor / utility_remember_threshold /
    # reentry_top_k are intentionally ABSENT so their deferral is visible rather
    # than looking active with dead values.
    reentry_top_k: 5         # still used: top-k reservoir scores for candidate rank

    # --- async handoff ---
    async_mine_every_steps: 1000  # trainer checkpoint cadence (doc range 1000-2000;
                             # avoid tiny values, checkpoints are large). Retune
                             # after run 1 from async_gap_steps / data_age_steps /
                             # rounds_skipped / miner_idle_time.
    bootstrap_checkpoint_step: 0   # 0 = disabled. When >0 and < async_mine_every_steps
                             # the trainer saves ONE extra checkpoint at this step, so
                             # the miner stops idling at startup (it has no base-model
                             # fallback and otherwise waits for step 1000). Leaves the
                             # steady-state cadence and async_gap_steps unchanged, but
                             # it is NOT a free speedup: the extra round runs ~51
                             # maintenance intervals that mutate the PERSISTED cache
                             # (H / Z_mc / utility / RNG) and shift the weights, so the
                             # whole trajectory forks and never re-converges. Treat as
                             # an ABLATION: hold it constant across every arm of a
                             # sweep, never flip it partway through one.
    ready_poll_steps: 100    # trainer ready-marker check; decoupled from the above
    async_poll_interval: 60  # miner sleep while waiting for a valid checkpoint
    trainer_gpu: 0
    miner_gpu: 1

    # --- training knobs ---
    learning_rate: 1e-5
    num_epochs: 2
    batch_size: 64
    train_group_size: 2
    mc_batch_size: 1024      # trainer encode batch
    bf16: true                # bf16 WEIGHTS, not just autocast: Tevatron's driver
                              # derives torch_dtype from this for the in-batch and
                              # cross-batch arms, so the BRIGHT comparison would
                              # otherwise straddle two numerical paths.
    dataloader_num_workers: 2
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    logging_steps: 100
    eval_top_k: 10
    per_device_eval_batch_size: 256

  async_fast_grass_pilot:
    # 10% representative pilot for LAMBDA SELECTION. Inherits every key from
    # `async_fast_grass` above and overrides only what the pilot changes, so the
    # pilot and the full confirmation cannot silently drift apart.
    #
    # Driven by a deterministic stratified manifest (33,000 = 8,303 MS MARCO +
    # 14,997 VL + 9,700 HQ, seed 42) built by scripts/async_fast_grass_pilot.py.
    # `--debug` is NOT a substitute: it takes train_items[:512] after an
    # alphabetical file glob, which is effectively HQ-only.
    #
    #   steps_per_epoch = ceil(33000 / 64) = 516   ->  max_steps = 1032
    #
    # cache_update_interval 10 (not 100) only changes maintenance GRANULARITY; the
    # per-interval budget scales with it, so the total maintenance work matches the
    # full run:  0.5 * 32000 * 10 / 516 ~= 310  ==  0.5 * 32000 * 100 / 5157.
    <<: *async_fg_base
    model_name: "async_fast_grass_pilot_bge_m3"
    num_epochs: 2
    batch_size: 64
    B_doc: 32000
    T: 3
    m: 1
    train_group_size: 2
    selection_mode: "topk"
    learning_rate: 1e-5
    cache_update_interval: 10
    async_mine_every_steps: 100
    ready_poll_steps: 10
    async_poll_interval: 10
    max_age_steps: 100       # == async_mine_every_steps, so the FIRST numeric round
                             # is already eligible to refresh over-age slots
    logging_steps: 10
    bootstrap_checkpoint_step: 0
    requires_manifest: true  # HARD requirement, not a default. Every number in this
                             # block (steps_per_epoch 516, the cache_update_interval
                             # 10 that sizes the budget, max_age_steps 100) is derived
                             # from the 33k manifest. Running it against the full 330k
                             # mixture silently becomes a different experiment.
    pilot_gate_min_steps: 128   # a numeric mined round with num_refresh_total > 0
                             # must be consumed for at least this many optimizer
                             # steps or the run is INVALID and exits nonzero.
                             # Absent from `async_fast_grass` on purpose: the full
                             # run has no pilot gate.

  async_fast_grass_smoke:
    # DelftBlue GPU wiring smoke: 1,024 stratified records, tiny cache, fast
    # cadences. Proves the async loop cycles end to end; proves nothing about
    # quality. No BRIGHT evaluation.
    #
    #   steps_per_epoch = ceil(1024 / 64) = 16  ->  max_steps = 64
    #
    # num_epochs 4 rather than 2 removes a timing race: at 32 steps the miner has
    # only ~22 training steps after checkpoint-10 to load it, mine, publish and be
    # consumed, and a longer SLURM allocation does not help because the trainer
    # exits at step 32 regardless. 64 steps costs seconds.
    <<: *async_fg_base
    model_name: "async_fast_grass_smoke_bge_m3"
    num_epochs: 4
    B_doc: 512
    T: 3
    cache_update_interval: 1
    async_mine_every_steps: 10
    ready_poll_steps: 2
    async_poll_interval: 5
    max_age_steps: 10
    logging_steps: 2
    bootstrap_checkpoint_step: 0
    requires_manifest: true  # see async_fast_grass_pilot; without the 1,024-item
                             # manifest steps_per_epoch becomes 5,157 and the budget
                             # 0.5*512*1/5157 rounds to ZERO slots per interval
    pilot_gate_min_steps: 1  # 64 total steps cannot reach the pilot's 128

  ance:
    base_model: "BAAI/bge-m3"   # every mining arm starts from the SAME base as the
                                # in-batch baseline, so the BRIGHT table compares one
                                # variable: negative selection. Warm-starting these
                                # from inbatch_mixed_bge_m3 gave them ~2x the baseline's
                                # cumulative optimizer steps.
    model_name: "ance_mixed_bge_m3"
    train_group_size: 2       # 1 explicit mined negative — paper: "uniformly sample one
                              # negative from ANN top 200". Under the shared BGE-M3/
                              # Tevatron objective the effective in-batch pool is 127 = 64*2-1:
                              # that 1 mined negative plus 126 passages belonging to
                              # other examples, which the pinned loss does NOT mask. This is
                              # ANCE-style mining, not Microsoft's pairwise RoBERTa reproduction.
                              # For the record, upstream is 1 hard negative and ZERO in-batch
                              # (models.py:76-81 builds a [B, 2] softmax); --negative_sample 20
                              # is run COVERAGE, 20 separate instances at 20 separate steps,
                              # never a 20-wide denominator. So this arm contrasts against MORE
                              # negatives than ANCE does, not fewer. Report it as "ANCE-style
                              # mining"; `ance_paper` is the faithful reproduction.
    mining_depth: 200         # paper Table 7 "TopKNeg"
    total_epochs: 2           # MATCHED to the GRASS arms (grass/fast_grass/async all run
                              # num_epochs 2 at batch 64, group 2), so the BRIGHT table
                              # compares negative SELECTION at an equal optimizer-step
                              # budget. steps_per_epoch is floor(n/batch), matching
                              # run_grass.py:332 and the trainer's own drop_last=True.
                              # The reference ANCE is step-budgeted and far longer
                              # (0.330 MRR@10 reported at 600K steps), so this is a
                              # lower bound on ANCE, not ANCE at convergence.
    learning_rate: 1e-5
    batch_size: 64
    per_device_eval_batch_size: 64   # 512 -> 64 for p1024 encoding. The short-passage
                              # throughput setting does not transfer to a 1024-token cap.
    gradient_checkpointing: true     # THE memory fix at q1024/p512 + eager attention,
                              # matching the in-batch arm this is compared against.
    ann_chunk_factor: 1       # Mine every BRIGHT training query each round. This smaller
                              # dataset does not need Microsoft's five-way MS MARCO shard;
                              # full coverage maximizes exposure inside the two-epoch budget.
    max_encode_seconds: 21600 # 6h. The ANCE stall detector: a heartbeat cannot detect a
                              # deadlocked encode subprocess, a timeout can. Deliberately
                              # generous — this is a hang guard, not a performance budget.
    min_fresh_rounds: 2       # rounds from DISTINCT checkpoints, each consumed for at
                              # least logging_steps. One refresh is not an ANCE loop.
    bf16: true                # bf16 WEIGHTS, not just autocast: Tevatron's driver
                              # derives torch_dtype from this for the in-batch and
                              # cross-batch arms, so the BRIGHT comparison would
                              # otherwise straddle two numerical paths.
    dataloader_num_workers: 2
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    save_steps: 1000          # THIS IS THE ANN REFRESH INTERVAL m, not a convenience:
                              # saving a checkpoint is what triggers the Inferencer
                              # ("update the ANN index once every m batches, i.e. with
                              # checkpoint f_k"). Hold it constant across the sweep.
                              # Matches async_fast_grass.async_mine_every_steps and its
                              # documented 1000-2000 range; ~10 checkpoints over the
                              # 2-epoch budget, which also bounds disk without a pruner.
    logging_steps: 100        # also the trainer's ready-marker poll interval
    eval_top_k: 10
    data_gen_poll_interval: 60
    corpus_file: "reasonir_corpus.jsonl"
    train_queries_file: "train_queries.jsonl"
    train_qrels_file: "train_qrels.txt"
    mixture_dir: "training_mixture"
    temp_workdir: "temp_ance"
    setup_mode: "reasonir_mixture"
    eval_corpus_file: null
    eval_queries_file: null
    eval_qrels_file: null
    eval_metric: "ndcg_cut_10"




  ance_paper:
    # PAPER-FIDELITY ANCE — a reproduction of Microsoft's MS MARCO passage result,
    # NOT a GRASS control arm. Runs through the SAME entry point, miner, round
    # handoff and supervision as `ance`; only the model, loss and optimizer differ.
    #   python scripts/train_ance.py --recipe ance_paper
    # Model/objective/mining values below follow microsoft/ANCE. The explicitly
    # documented precision and training-budget deviations fit the DelftBlue limit.
    paper_fidelity: true
    model_name: "ance_paper_roberta"
    # The released BM25 warm-up @60K. `from_pretrained` maps roberta.*/embeddingHead.*/
    # norm.* directly onto AnceEncoder — no conversion step. The released ANCE @600K is
    # an EVALUATION reference only; add its weight hash below when the artifact arrives.
    base_model: "/scratch/aimanabdulwaha/dense-retrieval-SOTA/models/ance_bm25_warmup_60k"
    # EXACT allow-list, not a deny-list. A deny-list can only refuse hashes someone
    # thought to write down, so an empty one admits any structurally compatible
    # checkpoint — the released, finished 600K weights included, which would
    # "reproduce" 0.330 by construction. Produce the value on DelftBlue with:
    # train_ance_warmup.py PRINTS this hash on success; copy it from there. To
    # recompute it, note transformers 4.40.2 writes model.safetensors, not
    # pytorch_model.bin (assert_permitted_init accepts either):
    #   python -c "import sys;sys.path.insert(0,'src');from utils.helpers import _sha256
    #              print(_sha256('<base_model>/model.safetensors'))"
    # The run REFUSES to start while this is null.
    expected_init_sha256: "17e06536c86ce874ea911d9080a3aa0657877fe344d6390703538fd4b2b802cf"

    # Objective geometry. These OVERRIDE model.* — without them the manifest and the
    # embedding cache would inherit normalize:true / temperature:0.02 and describe a
    # scaled-cosine objective this arm does not use (model/models.py:77-81).
    normalize: false
    temperature: 1.0            # explicit no-scaling; upstream has no temperature
    pooling: "cls"              # masked_mean_or_first, use_mean=False (models.py:43-49)
    query_max_len: 64           # --max_query_length; 128 is the BM25 warm-up ONLY
    passage_max_len: 512        # --max_seq_length (run_train.sh:25)

    train_group_size: 21        # 20 mined negatives: --negative_sample 20. The miner's
                                # existing n_negs = train_group_size - 1 yields 20, and
                                # the trainer expands each into its own triplet
                                # (--triplet, data/msmarco_data.py:337-362).
    mining_depth: 200           # --topk_training (run_train.sh:93)
    batch_size: 64              # 8 x 2 x 4 GPUs upstream; one A100 fits 64 directly
    learning_rate: 1.0e-6       # run_train.sh:36
    lamb_eps: 1.0e-8            # --adam_epsilon, passed to LAMB as eps
    weight_decay: 0.0           # upstream default; LAMB folds it into adam_step
    max_grad_norm: 1.0
    warmup_steps: 5000          # ABSOLUTE (run_train.sh:33), not a ratio
    # STEP-budgeted, like the reference, and the two steps are different numbers.
    # --single_warmup builds ONE linear decay over --max_steps (default 1,000,000)
    # while the released comparison checkpoint is 600K, so the horizon sets the LR at
    # every step and the stop step only decides where the run ends (run_ann.py:174-178).
    scheduler_max_steps: 1000000
    train_stop_steps: 300000    # Fixed one-allocation hardware budget. 600K does not fit
                                # one 24h allocation on a single A100 and there is no
                                # cross-job resume; the deviation is recorded in provenance.
    ann_chunk_factor: 5         # --ann_chunk_factor default (run_ann_data_gen.py:543)
    max_encode_seconds: 43200   # 12h hang guard on the 8.8M-passage encode
    min_fresh_rounds: 2
    gradient_checkpointing: false  # upstream has none, and RoBERTa-base at q64/p512
                                # does not need it
    save_steps: 10000           # --save_steps: THE ANN REFRESH INTERVAL m
    logging_steps: 100          # --logging_steps; also the round-poll interval
    bf16: true                  # AUTOCAST ONLY -- parameters stay FP32 here, unlike the
                                # BGE arms, which load bf16 weights to match Tevatron's
                                # driver. LAMB at lr 1e-6 moves a weight by far less
                                # than bf16 can represent, so bf16 master weights would
                                # round most updates to zero. A labelled deviation
                                # either way: the supplied ANCE command runs FP32
                                # throughout (--fp16 is store_true and run_train.sh
                                # never passes it; only run_train_warmup.sh does).
                                # bf16 needs no GradScaler, so there are no skipped
                                # updates and global_step IS the successful-step count.
    per_device_eval_batch_size: 256
    dataloader_num_workers: 4
    eval_top_k: 1000
    data_gen_poll_interval: 60

    corpus_file: "msmarco_corpus.jsonl"
    train_queries_file: "msmarco_train_queries.jsonl"
    train_qrels_file: "msmarco_train_qrels.txt"
    mixture_dir: "msmarco_training_mixture"
    temp_workdir: "temp_ance_paper"
    setup_mode: "tevatron_msmarco"
    eval_corpus_file: "msmarco_corpus.jsonl"
    eval_queries_file: "msmarco_dev_queries.jsonl"
    eval_qrels_file: "msmarco_dev_qrels.txt"
    eval_metric: "mrr_at_10"

  ance_paper_warmup:
    # THE BM25 WARM-UP `ance_paper` INITIALIZES FROM. Microsoft's released 60K warm-up
    # is gone -- both blob URLs return HTTP 409 and microsoft/ANCE #23/#24/#26 have been
    # open since 2022 -- and the only surviving mirror is bit-identical to the 600K
    # FINAL, which assert_permitted_init exists to refuse. So we train it.
    #   python scripts/train_ance_warmup.py
    # Values mirror commands/run_train_warmup.sh. Same model, same loss (NLL,
    # models.py:77-81 == ance_paper.pairwise_nll) and same optimizer as `ance_paper`;
    # only the negatives (static BM25, not mined ANN), the lengths and the
    # hyperparameters differ. There is no mining and no round handoff here.
    paper_fidelity: true
    model_name: "ance_bm25_warmup_60k"
    base_model: "roberta-base"      # the projection head does not exist yet; the
                                    # warm-up is what trains it
    mixture_dir: "msmarco_training_mixture"

    train_group_size: 31      # 30 BM25 negatives already in the mixture, each expanded
                              # into its own (query, positive, negative) triplet by
                              # ANCEDataset's paper mode. 400,782 x 30 = ~12M triplets;
                              # 60K steps at batch 32 consumes under 2M of them.
    batch_size: 32            # --per_gpu_train_batch_size 32
    learning_rate: 2.0e-4     # --learning_rate 2e-4. 200x the ANCE lr: this is a fresh
                              # head on a cold body, not a refinement.
    lamb_eps: 1.0e-8
    weight_decay: 0.0
    max_grad_norm: 1.0
    warmup_steps: 1000        # --warmup_steps 1000, ABSOLUTE
    train_stop_steps: 60000   # the released checkpoint's label is 60K
    # NOT a typo, and not the stop step. Upstream decays over
    # num_train_epochs 2.0 x expected_train_size 35,000,000 / batch 32 = ~2.19M steps,
    # so at step 60K the LR is still ~2e-4 (essentially flat). Collapsing this to 60000
    # would decay it to zero by the end and be a different optimization entirely.
    scheduler_max_steps: 2187500

    # BOTH 128 (--max_seq_length 128 feeds all three fields through one processor).
    # NOT ance_paper's q64/p512 -- inheriting those would be a different warm-up.
    query_max_len: 128
    passage_max_len: 128
    normalize: false          # raw dot, as in ance_paper
    temperature: 1.0
    pooling: "cls"
    bf16: true                # FP32 weights under bf16 autocast, matching ance_paper.
                              # At lr 2e-4 the bf16-underflow argument does not bind
                              # either way; keeping it identical removes an axis of
                              # difference between the two runs.
    gradient_checkpointing: false
    dataloader_num_workers: 0   # 0, NOT 4: ANCEDataset holds the whole 5.2 GB mixture as
                              # Python objects (measured 28.4 GB RSS, job 75676), and each
                              # forked worker copies it as refcounting defeats COW.
                              # Tokenizing ~96 short texts is negligible beside a step.
    logging_steps: 1000       # --logging_steps 1000
    save_steps: 30000         # --save_steps 30000. Plain checkpointing here: this
                              # recipe has no ANN index, so it is NOT a refresh interval.
                              # Written as interim-<step>/, a RESCUE artifact with no
                              # optimizer state: there is no resume, and without it a
                              # wall-clock kill loses the whole run.


# --- Evaluation Settings (Restored & Cleaned) ---
evaluation:
  primary_metric: "recall_1000"
  eval_domains:
    - "biology"
    - "earth_science"
    - "economics"
    - "psychology"
    - "robotics"
    - "stackoverflow"
    - "sustainable_living"
    - "pony"
    - "leetcode"
    - "aops"
    - "theoremqa_theorems"
    - "theoremqa_questions"
  metrics:
    - "MRR"
    - "NDCG@10"
    - "Recall@1000"
  top_k: 1000
  batch_size: 64            # 128 -> 64 with passage_max_len 1024. Encode-only
                            # throughput: it is not part of the encoding contract and
                            # moves no metric, but 128 x 1024 tokens on the 413k-doc
                            # leetcode corpus is where evaluation would OOM.
  trec_eval_path: "trec_eval"
  bf16: True
  dataloader_num_workers: 4
  bm25:
    k1: 0.9
    b: 0.4
