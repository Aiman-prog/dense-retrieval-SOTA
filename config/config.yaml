# --- Reproducibility ---
seed: 42

# --- Global Model Settings ---
model:
  base_model: "BAAI/bge-m3"
  pooling: "cls"  # BGE-M3 uses CLS pooling for dense retrieval
  normalize: true
  temperature: 0.02  # Standard for dense retrieval contrastive learning
  query_max_len: 256   # ✅ Verified: 100% coverage (all datasets)
  passage_max_len: 128  # ✅ Verified: 99% coverage, 4x faster training (1% truncation acceptable)

# --- Paths Configuration ---
paths:
  data_dir: "data"
  processed_dir: "data/processed"
  bright_cache: "data/bright"
  models_dir: "models"
  results_dir: "results/bright_benchmark"

# --- Data Sources ---
data:
  bright:
    name: "xlangai/BRIGHT"
    examples_config: "Gemini-1.0_reason"
    cache_dir: "data/bright"
  reasonir:
    name: "reasonir/reasonir-data"
    subset: "hq"
    train_file: "train_reasonir.jsonl"
  mixed_training:
    msmarco_samples: 83030   # 23.7% - Public data bridge + calibration (prevent forgetting)
    vl_samples: 149970       # 42.8% - ALL available clean VL (length generalization)
    hq_samples: 97000        # 27.7% - Nearly all HQ (reasoning-intensive queries)
    # Total: ~350k samples | Note: VL corrupted before index 95k, only 150k clean samples available
  msmarco:
    name: "sentence-transformers/msmarco-distilbert-margin-mse-mean-dot-v1"
    subset: "triplet"

# --- Training Recipes ---
training:
  logging_steps: 100
  overwrite_output_dir: true
  dataloader_num_workers: 4
  inbatch:
    model_name: "inbatch_mixed_bge_m3"
    batch_size: 64
    learning_rate: 1e-5
    num_epochs: 2
    train_group_size: 2
    bf16: True
    dataloader_num_workers: 4
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
  crossbatch:
    model_name: "crossbatch_mixed_bge_m3_epoch2"
    batch_size: 16
    target_batch_size: 2048
    per_device_batch_size: 64
    gradient_accumulation_steps: 16
    gc_q_chunk_size: 16
    gc_p_chunk_size: 16
    learning_rate: 1e-5  # Lower LR for BGE-M3 continued training
    warmup_ratio: 0.1
    weight_decay: 0.01
    num_epochs: 2  # Quick validation run
    train_group_size: 2
    grad_cache: true
    bf16: true
    max_grad_norm: 1.0
    logging_steps: 10
    dataloader_num_workers: 4
  grass:
    # ============================================================
    # MODE SWITCH — change ONE line to swap algorithms:
    #   uncertainty_mode: "ema"         → EMA Teacher-Student  (~4h,  paper Algorithm 2 EMA branch)
    #   uncertainty_mode: "mc_dropout"  → MC-Dropout           (~22h, paper Algorithm 2 MC-dropout branch)
    # ============================================================
    uncertainty_mode: "mc_dropout"

    model_name: "grass_mixed_bge_m3"   # base name — code appends _ema or _mcdp automatically
    base_model: "/scratch/aimanabdulwaha/dense-retrieval-SOTA/models/inbatch_mixed_bge_m3"

    # --- Shared ---
    P: 200             # candidates retrieved from stale ANN per query
    L: 25              # shortlist size: top-L by cheap pass (L <= P) — [S9] halved from 50
    m: 1               # negatives per query (= train_group_size - 1)
    lambda_val: 1.0    # uncertainty weight in g = s_hat + lambda * sigma (seq_bandit default; was 2.0 for async)
    mc_batch_size: 512 # encoding batch size (controls peak GPU memory during mining)
    learning_rate: 1e-5
    num_epochs: 3
    train_group_size: 2
    bf16: true
    dataloader_num_workers: 2
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    save_strategy: "steps"
    save_steps: 1000   # [S12] doubled from 500 — saves ~2 min in checkpoint I/O per 3 epochs
    save_total_limit: 1
    logging_steps: 100
    eval_top_k: 10
    per_device_eval_batch_size: 256

    # --- EMA-specific (used when uncertainty_mode: "ema") ---
    ema_alpha: 0.999
    ema_batch_size: 64 # [AdamW8bit] doubled from 32 — safe once 8-bit Adam frees ~3.9GB VRAM

    # --- CaseBandit MAB [S8] (EMA mode only) ---
    mab_n_das:     5      # challengers mined per batch (out of ema_batch_size=32)
    mab_alpha:     1.0    # LinUCB exploration constant
    mab_epsilon:   0.05   # gap-index threshold for J_t graduation
    mab_min_pulls: 2      # min mines before J_t eligibility

    # --- MC-dropout-specific (used when uncertainty_mode: "mc_dropout") ---
    T: 5               # MC-dropout forward passes
    mc_dropout_p: 0.3  # dropout probability for MC passes (0.1 default is too weak)
    query_batch_size: 128  # queries per GrassSampler outer batch
    batch_size: 64

    # --- Async 2-GPU settings (used when --async_mining) ---
    async_mining:            false        # true activates 2-GPU orchestrator
    selection:               "bandit"     # "bandit" or "random" (ablation switch)
    miner_poll_interval:     5            # seconds between miner mining cycles
    trainer_neg_poll_steps:  10           # trainer checks for neg updates every N steps
    bandit_epsilon:          0.2          # ε for epsilon-greedy: explore fraction

    # --- Sequential mode settings (run_grass_seq.py) ---
    mine_every:              2            # mine n_das queries every N training steps
  ance:
    base_model: "/scratch/aimanabdulwaha/dense-retrieval-SOTA/models/inbatch_mixed_bge_m3"
    model_name: "ance_mixed_bge_m3"
    train_group_size: 2       # 1 negative — matches original ANCE paper (Table 3)
    mining_depth: 200
    total_epochs: 3           # async design: Trainer runs continuously; Inferencer refreshes in parallel
    learning_rate: 1e-5
    batch_size: 64
    per_device_eval_batch_size: 512
    bf16: true
    dataloader_num_workers: 2
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    gradient_checkpointing: false
    save_steps: 500
    save_total_limit: 1
    logging_steps: 100
    eval_top_k: 10
    data_gen_poll_interval: 60
    corpus_file: "reasonir_corpus.jsonl"
    train_queries_file: "train_queries.jsonl"
    train_qrels_file: "train_qrels.txt"
    mixture_dir: "training_mixture"
    temp_workdir: "temp_ance"
    setup_mode: "reasonir_mixture"
    eval_corpus_file: null
    eval_queries_file: null
    eval_qrels_file: null
    eval_metric: "ndcg_cut_10"


# --- Evaluation Settings (Restored & Cleaned) ---
evaluation:
  eval_domains:
    - "biology"
    - "earth_science"
    - "economics"
    - "psychology"
    - "robotics"
    - "stackoverflow"
    - "sustainable_living"
    - "pony"
    - "leetcode"
    - "aops"
    - "theoremqa_theorems"
    - "theoremqa_questions"
  metrics:
    - "MRR"
    - "NDCG@10"
    - "Recall@1000"
  top_k: 1000
  batch_size: 128
  trec_eval_path: "trec_eval"
  bf16: True
  dataloader_num_workers: 4
  bm25:
    k1: 0.9
    b: 0.4