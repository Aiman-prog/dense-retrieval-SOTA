# --- Global Model Settings ---
model:
  base_model: "BAAI/bge-large-en-v1.5"
  pooling: "cls"
  normalize: true
  query_max_len: 256
  passage_max_len: 512

# --- Paths Configuration ---
paths:
  data_dir: "data"
  processed_dir: "data/processed"
  bright_cache: "data/bright"
  models_dir: "models"
  results_dir: "results/bright_benchmark"

# --- Data Sources ---
data:
  bright:
    name: "xlangai/BRIGHT"
    examples_config: "Gemini-1.0_reason"
    cache_dir: "data/bright"
  reasonir:
    name: "reasonir/reasonir-data"
    subset: "hq"
    train_file: "train_reasonir.jsonl"
  mixed_training:
    train_file: "train_mixed.jsonl"
    msmarco_samples: 20000
    vl_samples: 200000
    hq_samples: 50000
  msmarco:
    name: "sentence-transformers/msmarco-hard-negatives"
    subset: "triplet"

# --- Training Recipes ---
training:
  logging_steps: 100
  overwrite_output_dir: true
  dataloader_num_workers: 4
  inbatch:
    model_name: "inbatch_mixed_bge_large"
    batch_size: 64
    learning_rate: 5e-6  # Lower LR for BGE-large continued training
    num_epochs: 3  # More epochs for better learning
    train_group_size: 1
    bf16: True
    dataloader_num_workers: 4
  crossbatch:
    model_name: "crossbatch_mixed_bge_large"
    batch_size: 16
    target_batch_size: 2048
    per_device_batch_size: 64
    gradient_accumulation_steps: 16
    gc_q_chunk_size: 16
    gc_p_chunk_size: 16
    learning_rate: 1e-5  # Lower LR for BGE-large continued training
    warmup_ratio: 0.1
    weight_decay: 0.01
    num_epochs: 3  # More epochs for better learning
    train_group_size: 2
    grad_cache: true
    bf16: true
    max_grad_norm: 1.0
    logging_steps: 10
    dataloader_num_workers: 4
  ance:
    base_model: "/scratch/aimanabdulwaha/dense-retrieval-SOTA/models/inbatch_mixed_bge_large"
    model_name: "ance_mixed_bge_large"
    num_episodes: 3
    mining_depth: 200
    learning_rate: 1e-6  # Lower LR for BGE-large continued training
    batch_size: 64
    per_device_eval_batch_size: 512
    num_epochs: 3  # More epochs for better learning
    bf16: true
    train_group_size: 2
    dataloader_num_workers: 2
    gradient_checkpointing: true
    save_strategy: "no"
    save_total_limit: 1
    logging_steps: 100
    eval_top_k: 10


# --- Evaluation Settings (Restored & Cleaned) ---
evaluation:
  eval_domains:
    - "biology"
    - "earth_science"
    - "economics"
    - "psychology"
    - "robotics"
    - "stackoverflow"
    - "sustainable_living"
    - "pony"
    - "leetcode"
    - "aops"
    - "theoremqa_theorems"
    - "theoremqa_questions"
  metrics:
    - "MRR"
    - "NDCG@10"
    - "Recall@1000"
  top_k: 1000
  batch_size: 512
  trec_eval_path: "trec_eval"
  bf16: True
  dataloader_num_workers: 4