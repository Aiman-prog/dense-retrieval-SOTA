# --- Global Model Settings ---
model:
  base_model: "BAAI/bge-m3"
  pooling: "cls"  # BGE-M3 uses CLS pooling for dense retrieval
  normalize: true
  temperature: 0.02  # Standard for dense retrieval contrastive learning
  query_max_len: 256   # ✅ Verified: 100% coverage (all datasets)
  passage_max_len: 128  # ✅ Verified: 99% coverage, 4x faster training (1% truncation acceptable)

# --- Paths Configuration ---
paths:
  data_dir: "data"
  processed_dir: "data/processed"
  bright_cache: "data/bright"
  models_dir: "models"
  results_dir: "results/bright_benchmark"

# --- Data Sources ---
data:
  bright:
    name: "xlangai/BRIGHT"
    examples_config: "Gemini-1.0_reason"
    cache_dir: "data/bright"
  reasonir:
    name: "reasonir/reasonir-data"
    subset: "hq"
    train_file: "train_reasonir.jsonl"
  mixed_training:
    msmarco_samples: 83030   # 23.7% - Public data bridge + calibration (prevent forgetting)
    vl_samples: 149970       # 42.8% - ALL available clean VL (length generalization)
    hq_samples: 97000        # 27.7% - Nearly all HQ (reasoning-intensive queries)
    # Total: 350k samples | Note: VL corrupted before index 95k, only 150k clean samples available
  msmarco:
    name: "sentence-transformers/msmarco-distilbert-margin-mse-mean-dot-v1"
    subset: "triplet"

# --- Training Recipes ---
training:
  logging_steps: 100
  overwrite_output_dir: true
  dataloader_num_workers: 4
  inbatch:
    model_name: "inbatch_mixed_bge_m3"
    batch_size: 64
    learning_rate: 1e-5
    num_epochs: 2
    train_group_size: 2
    bf16: True
    dataloader_num_workers: 4
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
  crossbatch:
    model_name: "crossbatch_mixed_bge_m3_epoch2"
    batch_size: 16
    target_batch_size: 2048
    per_device_batch_size: 64
    gradient_accumulation_steps: 16
    gc_q_chunk_size: 16
    gc_p_chunk_size: 16
    learning_rate: 1e-5  # Lower LR for BGE-M3 continued training
    warmup_ratio: 0.1
    weight_decay: 0.01
    num_epochs: 2  # Quick validation run
    train_group_size: 2
    grad_cache: true
    bf16: true
    max_grad_norm: 1.0
    logging_steps: 10
    dataloader_num_workers: 4
  grass:
    model_name: "grass_mixed_bge_m3"
    base_model: "/scratch/aimanabdulwaha/dense-retrieval-SOTA/models/inbatch_mixed_bge_m3"
    P: 200             # candidates retrieved from stale ANN per query
    L: 50              # shortlist size: top-L by cheap pass before MC-dropout (L <= P)
    m: 5               # negatives per query (= train_group_size - 1)
    T: 10              # MC-dropout forward passes
    lambda_val: 0.5    # uncertainty weight in g = s_hat + lambda * sigma
    mc_batch_size: 256  # batch size for in-process MC-dropout encoding
    query_batch_size: 64  # number of queries processed per GrassSampler batch (controls peak GPU memory)
    learning_rate: 1e-5
    batch_size: 64
    per_device_eval_batch_size: 512
    num_epochs: 1
    train_group_size: 6
    bf16: true
    dataloader_num_workers: 2
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 1
    logging_steps: 100
    eval_top_k: 10
  ance:
    base_model: "/scratch/aimanabdulwaha/dense-retrieval-SOTA/models/inbatch_mixed_bge_m3"
    model_name: "ance_mixed_bge_m3"
    num_episodes: 3
    mining_depth: 200
    learning_rate: 1e-5  # Lower LR for BGE-M3 continued training
    batch_size: 64
    per_device_eval_batch_size: 512
    num_epochs: 1
    bf16: true
    train_group_size: 6
    dataloader_num_workers: 2
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    gradient_checkpointing: false
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 1
    logging_steps: 100
    eval_top_k: 10


# --- Evaluation Settings (Restored & Cleaned) ---
evaluation:
  eval_domains:
    - "biology"
    - "earth_science"
    - "economics"
    - "psychology"
    - "robotics"
    - "stackoverflow"
    - "sustainable_living"
    - "pony"
    - "leetcode"
    - "aops"
    - "theoremqa_theorems"
    - "theoremqa_questions"
  metrics:
    - "MRR"
    - "NDCG@10"
    - "Recall@1000"
  top_k: 1000
  batch_size: 128
  trec_eval_path: "trec_eval"
  bf16: True
  dataloader_num_workers: 4
  bm25:
    k1: 0.9
    b: 0.4