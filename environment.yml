name: dense-retrieval
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  # CORE SYSTEM LIBRARIES (Install via Conda)
  - python=3.10
  - pytorch=2.1.2
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - pip
  
  # EVERYTHING ELSE (Install via Pip - Instant resolution)
  - pip:
    # Basic Utilities
    - numpy>=1.24.0,<1.26.0
    - pandas>=2.0.0
    - pyyaml>=6.0
    - tqdm>=4.65.0
    - spacy>=3.5.0
    
    # Core ML Libraries
    - importlib_metadata
    - transformers>=4.36.0  # peft requires Cache class from transformers 4.36.0+
    - sentence-transformers>=2.2.0,<3.0.0
    - datasets>=2.14.0
    - accelerate>=0.25.0  # GitHub Tevatron requires clear_device_cache (added in 0.25.0+)
    - safetensors>=0.4.0
    # Tevatron additional dependencies
    - peft  # Parameter-Efficient Fine-Tuning (required by Tevatron)
    - deepspeed  # Optional but recommended for distributed training
    
    # Dense Retrieval Tools
    - faiss-gpu>=1.7.0  # Pip wheels for FAISS are stable now
    - pyserini>=0.22.0
    - pytrec-eval
    
    # GitHub Installs (Tevatron & GradCache)
    - qwen-omni-utils  # Required dependency for GitHub Tevatron
    - git+https://github.com/texttron/tevatron.git
    - git+https://github.com/luyug/GradCache.git